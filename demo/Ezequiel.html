<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ezequiel — Demo</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      color:#eef2ff;background:linear-gradient(160deg,#0b1028,#070914)
    }
    .card{
      width:min(390px,100%);padding:22px;border:1px solid rgba(255,255,255,.12);
      border-radius:22px;background:rgba(255,255,255,.06);
      box-shadow:0 22px 50px rgba(0,0,0,.4)
    }
    h1{margin:0 0 6px;font-size:30px}
    p{margin:0 0 18px;color:rgba(238,242,255,.68);line-height:1.45}
    input,button{
      width:100%;border-radius:14px;padding:13px;font-size:16px;font-weight:800
    }
    input{
      margin-bottom:10px;color:#eef2ff;background:rgba(0,0,0,.25);
      border:1px solid rgba(255,255,255,.12);outline:none
    }
    button{
      border:0;cursor:pointer;color:#071021;
      background:linear-gradient(135deg,#60a5fa,#22d3ee)
    }
    .secondary{
      margin-top:10px;color:#eef2ff;background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.12)
    }
    .error{min-height:20px;margin-top:10px;color:#fda4af;font-weight:800}
    .hidden{display:none}
    .badge{
      display:inline-block;margin-bottom:14px;padding:6px 10px;border-radius:999px;
      background:rgba(34,211,238,.12);color:#67e8f9;font-size:13px;font-weight:900
    }
  </style>
</head>
<body>
  <main class="card">
    <section id="login">
      <span class="badge">Versão demonstrativa</span>
      <h1>Ezequiel</h1>
      <p>Digite a senha para acessar esta demonstração.</p>
      <input id="password" type="password" placeholder="Senha" autocomplete="current-password">
      <button id="enter" type="button">Entrar</button>
      <div id="error" class="error" aria-live="polite"></div>
    </section>

    <section id="content" class="hidden">
      <span class="badge">Acesso liberado</span>
      <h1>Ezequiel</h1>
      <p>Esta é uma versão demonstrativa simples.</p>
      <button id="logout" class="secondary" type="button">Bloquear este navegador</button>
    </section>
  </main>

  <script>
    (() => {
      const PASSWORD = '1234';
      const ACCESS_KEY = 'ezequiel.demo.access.v1';

      const login = document.getElementById('login');
      const content = document.getElementById('content');
      const password = document.getElementById('password');
      const error = document.getElementById('error');

      function showContent() {
        login.classList.add('hidden');
        content.classList.remove('hidden');
      }

      if (localStorage.getItem(ACCESS_KEY) === 'liberado') {
        showContent();
      }

      document.getElementById('enter').addEventListener('click', () => {
        if (password.value === PASSWORD) {
          localStorage.setItem(ACCESS_KEY, 'liberado');
          error.textContent = '';
          showContent();
        } else {
          error.textContent = 'Senha incorreta.';
          password.select();
        }
      });

      password.addEventListener('keydown', event => {
        if (event.key === 'Enter') document.getElementById('enter').click();
      });

      document.getElementById('logout').addEventListener('click', () => {
        localStorage.removeItem(ACCESS_KEY);
        location.reload();
      });
    })();
  </script>
</body>
</html>
